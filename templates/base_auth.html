<!DOCTYPE html>
<html lang="pt-br" class="h-full" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de Gestão de TI{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full bg-[var(--bg)] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--brand-bg)] mb-4">
        <svg class="w-6 h-6 text-[var(--brand-text)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <h1 class="text-xl font-semibold text-[var(--text-primary)]">Sistema de Gestão de TI</h1>
      <p class="text-sm text-[var(--text-muted)] mt-1">9º Ofício de Notas</p>
    </div>
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-8 shadow-sm">
      {% block content %}{% endblock %}
    </div>
  </div>
  <script>
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') document.getElementById('html-root').classList.add('dark');
  </script>
</body>
</html>
