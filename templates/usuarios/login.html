{% extends 'base_auth.html' %}
{% block title %}Login — Sistema de Gestão de TI{% endblock %}
{% block content %}
<h2 class="text-base font-medium text-[var(--text-primary)] mb-6">Entrar no sistema</h2>
{% if form.errors %}
<div class="mb-4 p-3 rounded-lg bg-[var(--danger-bg)] border border-[var(--danger)]">
  <p class="text-sm text-[var(--danger-text)]">Usuário ou senha inválidos.</p>
</div>
{% endif %}
<form method="post" class="space-y-4">
  {% csrf_token %}
  <div>
    <label class="form-label">Usuário</label>
    <input type="text" name="username" autofocus class="form-input" placeholder="Login de rede">
  </div>
  <div>
    <label class="form-label">Senha</label>
    <input type="password" name="password" class="form-input" placeholder="••••••••">
  </div>
  <button type="submit" class="btn-primary w-full justify-center mt-2">
    Entrar
  </button>
</form>
<p class="mt-4 text-center text-xs text-[var(--text-muted)]">
  Esqueceu sua senha?
  <a href="{% url 'usuario_recuperar_senha' %}" class="text-[var(--accent)] hover:underline">Recuperar acesso</a>
</p>
{% endblock %}
