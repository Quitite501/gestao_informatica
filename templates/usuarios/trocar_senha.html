{% extends 'base_auth.html' %}
{% block title %}Criar nova senha — Sistema de Gestão de TI{% endblock %}
{% block content %}
<div style="text-align:center;margin-bottom:1.5rem">
  <div style="width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
    <svg width="22" height="22" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2 style="font-size:1rem;font-weight:600;color:var(--text-primary);margin-bottom:.375rem">Crie sua nova senha</h2>
  <p style="font-size:.8125rem;color:var(--text-muted)">Por segurança, defina uma senha pessoal antes de continuar.</p>
</div>
{% if erro %}
<div style="margin-bottom:1rem;padding:.75rem;border-radius:8px;background:var(--danger-bg);border:1px solid var(--danger);font-size:.875rem;color:var(--danger-text)">{{ erro }}</div>
{% endif %}
<form method="post" style="display:flex;flex-direction:column;gap:1rem">
  {% csrf_token %}
  <div>
    <label class="form-label">Nova senha</label>
    <input type="password" name="nova_senha" class="form-input" placeholder="Minimo 6 caracteres" autofocus>
  </div>
  <div>
    <label class="form-label">Confirmar nova senha</label>
    <input type="password" name="confirmar_senha" class="form-input" placeholder="Repita a nova senha">
  </div>
  <button type="submit" class="btn-primary" style="margin-top:.5rem">Salvar nova senha</button>
</form>
{% endblock %}
